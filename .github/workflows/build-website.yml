name: Build website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static website
        run: pnpm --filter @workspace/alaina-bouw-website run build

      - name: Commit static website to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .htaccess apple-touch-icon.png favicon.ico favicon-32.png favicon-48.png icon-192.png icon-512.png index.html logo-mark.png og-image.jpg project-photos robots.txt sitemap.xml site.webmanifest assets
          if ! git diff --cached --quiet; then
            git commit -m "Update generated Plesk website"
            git push
          fi

      - name: Package website for Plesk
        run: |
          cd artifacts/alaina-bouw-website/dist/public
          zip -r "$GITHUB_WORKSPACE/alaina-bouw-plesk-upload.zip" .

      - name: Upload deployable website
        uses: actions/upload-artifact@v4
        with:
          name: alaina-bouw-plesk-website
          path: alaina-bouw-plesk-upload.zip
          if-no-files-found: error
          retention-days: 14
